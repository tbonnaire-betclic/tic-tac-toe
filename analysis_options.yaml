# Aligned with flutter-front's analysis_options.yaml.
include: package:very_good_analysis/analysis_options.yaml

plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - "build/**"
    - "**/*.freezed.dart"
    - "**/*.g.dart"
    - "lib/presentation/l10n/generated/**"
    - android/**
    - ios/**
    - web/**
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

formatter:
  page_width: 120
  trailing_commas: preserve

linter:
  rules:
    avoid_catching_errors: false
    avoid_redundant_argument_values: false
    implementation_imports: true
    lines_longer_than_80_chars: false
    omit_local_variable_types: false
    prefer_initializing_formals: false
    prefer_relative_imports: false
    public_member_api_docs: false
    require_trailing_commas: false
    sort_constructors_first: false
    # Not in very_good_analysis ^6 used by flutter-front; keeps `ClassName(...)` constructors.
    unnecessary_type_name_in_constructor: false
    prefer_expression_function_bodies: true
